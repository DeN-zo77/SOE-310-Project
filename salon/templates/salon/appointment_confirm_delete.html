{% extends 'salon/base.html' %}
{% block title %}Delete Appointment | Sharp Fade Barbershop{% endblock %}
{% block content %}
    <div class="container">
        <h2>Delete Appointment?</h2>
        <p>Are you sure you want to delete the appointment for <strong>{{ appointment.client_name }}</strong> on {{ appointment.date }}?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-delete">Yes, Delete</button>
            <a href="{% url 'appointment_list' %}" class="btn">Cancel</a>
        </form>
    </div>
{% endblock %}
